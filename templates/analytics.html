{% extends "base.html" %}

{% block title %}Analytics - Spendly{% endblock %}

{% block content %}
<div class="analytics-coming-soon">
    <div class="coming-soon-card">
        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        </div>

        <div class="badge">COMING SOON</div>

        <h1 class="display-heading">Advanced Analytics</h1>

        <p class="description">
            We're working on powerful insights and visualizations to help you understand your spending patterns better.
        </p>

        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <p class="footer-note">We're crafting something special</p>
    </div>
</div>

<style>
    .analytics-coming-soon {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 2rem;
    }

    .coming-soon-card {
        background: white;
        padding: 4rem 3rem;
        border-radius: 2rem;
        box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        text-align: center;
        max-width: 600px;
        width: 100%;
        position: relative;
        overflow: hidden;
    }

    /* Decorative background element similar to the wireframe */
    .coming-soon-card::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 150px;
        height: 150px;
        background: var(--paper);
        border-bottom-left-radius: 100%;
        z-index: 0;
    }

    .icon-container {
        background: var(--accent);
        color: white;
        width: 80px;
        height: 80px;
        border-radius: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        position: relative;
        z-index: 1;
    }

    .badge {
        background: var(--ink);
        color: white;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        padding: 0.5rem 1rem;
        border-radius: 2rem;
        display: inline-block;
        margin-bottom: 2rem;
        position: relative;
        z-index: 1;
    }

    .display-heading {
        font-family: 'DM Serif Display', serif;
        font-size: 2.5rem;
        color: var(--ink);
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 1;
    }

    .description {
        font-family: 'DM Sans', sans-serif;
        font-size: 1.125rem;
        color: #666;
        line-height: 1.6;
        margin-bottom: 3rem;
        position: relative;
        z-index: 1;
    }

    .dots {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 1;
    }

    .dots span {
        width: 6px;
        height: 6px;
        background: var(--ink);
        border-radius: 50%;
        opacity: 0.3;
    }

    .dots span:nth-child(2) {
        opacity: 1;
    }

    .footer-note {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.875rem;
        color: #999;
        position: relative;
        z-index: 1;
    }
</style>
{% endblock %}
