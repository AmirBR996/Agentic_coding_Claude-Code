{% extends "base.html" %}

{% block content %}
<div class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Add New Expense</h1>
            <p class="auth-subtitle">Keep track of your spending</p>
        </div>

        {% if error %}
        <div class="auth-error">
            {{ error }}
        </div>
        {% endif %}

        <div class="auth-card">
            <form method="POST" action="/expenses/add" class="expense-form">
                <div class="form-group">
                    <label for="amount">Amount (रु.)</label>
                    <input type="number" id="amount" name="amount" class="form-input" step="0.01" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input" value="{{ today_date }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <input type="text" id="description" name="description" class="form-input" placeholder="e.g. Weekly groceries">
                </div>

                <button type="submit" class="btn-submit">Save Expense</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
