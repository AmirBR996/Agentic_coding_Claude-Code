{% extends "base.html" %}

{% block content %}
<div class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Edit Expense</h1>
            <p class="auth-subtitle">Update the details of your expense</p>
        </div>

        {% if error %}
        <div class="auth-error">
            {{ error }}
        </div>
        {% endif %}

        <div class="auth-card">
            <form method="POST" action="/expenses/{{ expense.id }}/edit" class="expense-form">
                <div class="form-group">
                    <label for="amount">Amount (रु.)</label>
                    <input type="number" id="amount" name="amount" class="form-input" step="0.01"
                           value="{{ expense.amount }}" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled>Select a category</option>
                        <option value="Food" {% if expense.category == 'Food' %}selected{% endif %}>Food</option>
                        <option value="Transport" {% if expense.category == 'Transport' %}selected{% endif %}>Transport</option>
                        <option value="Bills" {% if expense.category == 'Bills' %}selected{% endif %}>Bills</option>
                        <option value="Health" {% if expense.category == 'Health' %}selected{% endif %}>Health</option>
                        <option value="Entertainment" {% if expense.category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
                        <option value="Shopping" {% if expense.category == 'Shopping' %}selected{% endif %}>Shopping</option>
                        <option value="Other" {% if expense.category == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           value="{{ expense.date }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <input type="text" id="description" name="description" class="form-input"
                           value="{{ expense.description or '' }}" placeholder="e.g. Weekly groceries">
                </div>

                <button type="submit" class="btn-submit">Update Expense</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
